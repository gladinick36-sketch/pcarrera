<html lang="es"><head><meta charset="utf-8">

<title>Águilas · Team PCarrera 4x4</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23d62839%22/%3E%3Cpath%20fill%3D%22%23fff%22%20d%3D%22M32%2010c3%200%205%202%205%205l1%202%202-1%2021-6c-2%2010-8%2019-16%2024l-4%202%203%2012-12-7-12%207%203-12-4-2C10%2027%204%2018%202%2010l21%206%202%201%201-2c0-3%202-6%206-6z%22%20transform%3D%22translate%280%206%29%20scale%281%29%22/%3E%3Cpath%20fill%3D%22%23d62839%22%20d%3D%22M36%2021l6%203-6%201z%22/%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2219%22%20r%3D%221.4%22%20fill%3D%22%23d62839%22/%3E%3C/svg%3E">

<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>:root{--bg:#0d0d0d;--c1:#171717;--c2:#232323;--ln:#2f2f2f;--tx:#f4f4f4;--mu:#9b9b9b;--rd:#d62839;--gr:#2fbf71;--ye:#ffcc00;--bl:#1d4ed8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
h1,h2,h3,.num,.tag,.hd b{font-family:'Barlow Condensed','Arial Narrow',Impact,sans-serif;text-transform:uppercase;letter-spacing:.04em;margin:0;font-weight:800}
h2{font-size:26px;margin-bottom:12px}
header.hd{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:#000;position:sticky;top:0;z-index:5}
.hd img{height:46px}.hd div{flex:1;line-height:1.1}.hd b{font-size:21px;display:block}.hd small{color:var(--mu)}
.flag{height:4px;background:linear-gradient(90deg,var(--ye) 33.33%,var(--bl) 33.33% 66.66%,var(--rd) 66.66%)}
main{padding:16px;max-width:680px;margin:auto}
.card{background:var(--c1);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:14px}
.wk.big{border-color:var(--rd);background:linear-gradient(160deg,#2a1013,var(--c1))}
.wk.ok{border-color:var(--gr)}
.tag{color:var(--rd);font-size:16px}
.num{font-size:68px;line-height:1;margin:4px 0 10px}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--ln)}
.row span{color:var(--mu)}.row b{text-align:right;font-weight:600}
.btn{width:100%;padding:14px;border:0;border-radius:12px;font:700 16px 'Barlow',sans-serif;background:var(--c2);color:var(--tx);margin-top:12px;cursor:pointer}
.pri{background:var(--rd)}.ghost{background:transparent;border:1px solid var(--gr);color:var(--gr)}
.btn.s{width:auto;padding:8px 12px;margin:0;font-size:14px}
.btn.danger{color:var(--rd)}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--ln);background:#0f0f0f;color:var(--tx);font:16px 'Barlow',sans-serif;margin:4px 0 10px}
label{font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
input[type=range]{padding:0;accent-color:var(--rd);height:36px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chip{padding:9px 14px;border-radius:99px;border:1px solid var(--ln);background:var(--c2);color:var(--tx);font:600 14px 'Barlow',sans-serif;cursor:pointer}
.chip.on{background:var(--rd);border-color:var(--rd)}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dy{background:var(--c2);border-radius:12px;padding:8px 0;text-align:center;border:1px solid transparent;cursor:pointer}
.dy small{display:block;color:var(--mu);text-transform:uppercase;font-size:11px}.dy b{font-size:18px}.dy i{display:block;font-style:normal;font-size:13px}
.dy.done{background:#10301f;color:var(--gr)}.dy.pend{color:var(--ye)}.dy.miss{color:var(--rd)}.dy.now{border-color:var(--tx)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cd{aspect-ratio:1;background:var(--c2);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;cursor:pointer}
.cd.now{border:1px solid var(--tx)}.cd.sel{background:var(--rd)}
.cd i{width:6px;height:6px;border-radius:9px;margin-top:3px}.cd i.g{background:var(--gr)}.cd i.r{background:var(--ye)}
.cal .h{color:var(--mu);font-size:12px}
nav.bar{position:fixed;bottom:0;left:0;right:0;display:flex;background:#000;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.bar button{flex:1;padding:10px 4px;background:none;border:0;color:var(--mu);font:600 12px 'Barlow',sans-serif}
nav.bar button.on{color:var(--tx)}nav.bar span{display:block;font-size:22px}
.ov{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.md{background:var(--c1);width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:99px;z-index:30;font-weight:700;max-width:90vw;text-align:center}
.bd{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--c2)}.bd.ok{color:var(--gr)}.bd.w{color:var(--ye)}.bd.no{color:var(--rd)}
.dot{width:16px;height:16px;border-radius:50%;display:inline-block;background:#555}
.s-g{background:var(--gr)}.s-y{background:var(--ye)}.s-r{background:var(--rd)}
.mn{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.mn>button{background:var(--c2);border:0;color:var(--tx);width:44px;height:44px;border-radius:12px;font-size:18px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stats .card{text-align:center;margin:0}.stats .num{font-size:44px;margin:0}
.muted{color:var(--mu)}
.it{border-top:1px solid var(--ln);padding:10px 0}.it:first-child{border-top:0}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.ath{display:flex;align-items:center;gap:12px;cursor:pointer}.ath div{flex:1}
.wk.test{border-color:var(--bl);background:linear-gradient(160deg,#0e1a33,var(--c1))}
.wk.rest{border-color:var(--ye);background:linear-gradient(160deg,#2a2308,var(--c1))}
.tag.test{color:var(--bl)}.tag.rest{color:var(--ye)}
.bd.clima{color:var(--bl)}
.pacer{display:flex;gap:6px}.pacer input{flex:1;margin:0}.pacer button{width:42px;flex:none;margin:0;border-radius:10px;border:1px solid var(--ln);background:var(--c2);color:var(--tx);font:700 16px 'Barlow',sans-serif}
.rgrid .row{align-items:center}
.rgrid input{margin:0}
.cd i.b{background:var(--bl)}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1}
.pacer select{width:92px;flex:none;margin:0;padding:12px 6px}
.tpl-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--ln)}
.tpl-row b{flex:1;font-weight:600}
.cf{border-color:var(--ye);background:linear-gradient(160deg,#262008,var(--c1))}.cf .tag{color:var(--ye)}.cf .num{font-size:64px;margin:0 0 2px}
.cf-when{display:inline-block;margin:10px 0 0;padding:5px 12px;border-radius:99px;background:var(--c2);font-weight:600;font-size:14px}
.cf-bar{margin:16px 0 6px}
.cf-sv{display:block;width:100%;height:110px;cursor:pointer;touch-action:manipulation}
.cf-a0{fill:#2a2a2a}.cf-l0{fill:none;stroke:#5a5a5a;stroke-width:2;vector-effect:non-scaling-stroke}
.cf-a1{fill:var(--gr);fill-opacity:.28}.cf-l1{fill:none;stroke:var(--gr);stroke-width:2.5;vector-effect:non-scaling-stroke}
.cf-cur{stroke:var(--tx);stroke-width:1;stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
.cf-lb{position:relative;height:18px;margin-top:6px;font-size:12px;color:var(--mu)}
.cf-lb span{position:absolute;transform:translateX(-50%);white-space:nowrap}.cf-lb span:first-child{transform:none}.cf-lb span.end{transform:translateX(-100%);color:var(--tx);font-weight:600}
.cf-tip{font-size:14px;margin:6px 0 4px;min-height:20px}
.dns{margin-bottom:14px}.dn{text-align:center;margin:0}.dn svg{width:100%;max-width:130px;display:block;margin:0 auto 6px}
.dn0{fill:none;stroke:var(--c2);stroke-width:11}.dn1{fill:none;stroke-width:11;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50px 50px}
.dn text{fill:var(--tx);font:800 26px 'Barlow Condensed',sans-serif;text-anchor:middle;dominant-baseline:central}
.dn b{display:block;font:800 17px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.04em}.dn .muted{font-size:13px}
.rt3{display:grid;grid-template-columns:1fr 1.5fr 1fr;align-items:center;gap:6px}.rt3>.tag,.rt3>.chips,.rt3>.muted{grid-column:1/-1}.rt3>.chips{margin:2px 0 6px}.rt3>.muted{text-align:center;font-size:13px;margin-top:6px}
.dn.sm svg{max-width:84px}.dn.sm b{font-size:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g3 input{margin-top:2px}
/* mesociclos y microciclos en el calendario: líneas delgadas */
.cy{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:2px 12px;margin:-1px 0 2px;padding:2px 8px;border-left:2px solid var(--ye);background:var(--c2);border-radius:0 6px 6px 0;font:700 11px/1.35 'Barlow Condensed','Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);text-align:left}
.cy.me{display:flex;justify-content:space-between;align-items:center;margin:10px 0 0;padding:3px 10px;border-left-color:var(--rd);color:var(--tx);font-size:12px}
.cy.me small{color:var(--mu);font-weight:600}
/* uniforme */
.uni img,.upop img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--c2)}
.upop img{width:auto;max-width:100%;max-height:40vh;margin:auto}
.pm{background:var(--c2);border-radius:12px;padding:12px;margin:12px 0}
.pm-w{color:var(--ye);font-weight:600;margin:8px 0;font-size:14px}

.cd-n{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}.cd-n .num{font-size:52px;margin:0}.cd-n small{color:var(--mu);text-transform:uppercase;font-size:11px}
.dots{display:flex;gap:2px;justify-content:center;margin-top:3px}
.num.alt{font-size:40px}.pq{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 4px}.pq .chip{text-align:center}
</style></head><body><div id="app"></div>

const DIAS=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const MES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const RUTAS=["Rectorado","Vuelta Larga","Pista","Pista Montañera","Cortafuegos","Ruta CAF","Bombillo","Infinito","La Julia","Sabas Nieves"];
const DIST_DEF=[["200m","200 m"],["300m","300 m"],["400m","400 m"],["500m","500 m"],["1K","1 km"],["2K","2 km"],["2Kd","2 km con desnivel"],["3K","3 km"],["5K","5 km"],["5000p","5 000 m (pista)"],["5Kd","5 km con desnivel"],["10K","10 km"],["10000p","10 000 m (pista)"],["MM","Media maratón"],["MA","Maratón"]];
let DISTS=DIST_DEF.slice();
async function loadDists(){try{setDists(await get("Distancias"))}catch(e){}}
function setDists(r){if(!Array.isArray(r))return;const l=r.filter(x=>x.ID&&x.Nombre).map(x=>[String(x.ID).trim(),String(x.Nombre).trim(),N(x.Orden)]);
 if(l.length){l.sort((a,b)=>a[2]-b[2]);DISTS=l.map(x=>[x[0],x[1]])}}
const dLbl=k=>(DISTS.find(d=>d[0]===k)||["","?"])[1];
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const nd=v=>{if(!v)return"";v=String(v);if(/^\d{4}-\d\d-\d\d$/.test(v))return v;const d=new Date(v);return isNaN(d)?"":iso(d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((parseD(a)-parseD(b))/864e5);
const monday=s=>{const d=parseD(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
const today=()=>iso(new Date());
const fmtL=s=>{const d=parseD(s);return d.getDate()+" de "+MES[d.getMonth()]};
const pace=s=>{s=+s;return s?Math.floor(s/60)+":"+pad(s%60):""};
const parsePace=t=>{const m=String(t).trim().match(/^(\d+):(\d\d)$/);return m?+m[1]*60+ +m[2]:""};
const recF=s=>Math.floor(s/60)+":"+pad(s%60);
const rtime=s=>{s=+s;if(!s)return"";const h=Math.floor(s/3600);s%=3600;return(h?h+":"+pad(Math.floor(s/60)):Math.floor(s/60))+":"+pad(s%60)};
const parseRtime=t=>{t=String(t).trim();let m=t.match(/^(\d+):(\d\d):(\d\d)$/);if(m)return(+m[1])*3600+(+m[2])*60+ +m[3];m=t.match(/^(\d+):(\d\d)$/);return m?(+m[1])*60+ +m[2]:""};
const N=v=>v===""||v==null||isNaN(v)?0:+v;
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const same=(a,b)=>{a=String(a).trim();b=String(b).trim();return a===b||(a!==""&&!isNaN(a)&&!isNaN(b)&&Number(a)===Number(b))};
async function get(sheet){const r=await fetch(API+"?sheet="+sheet);return r.json()}
// ?boot=ID (o * para el coach): todo en una llamada. null si falla o si el Apps Script publicado todavía no la tiene.
async function getBoot(id){try{const r=await fetch(API+"?boot="+encodeURIComponent(id)),j=await r.json();return j&&j.ok?j:null}catch(e){return null}}
async function post(o){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(o)});return r.json()}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function modal(html){const m=document.createElement("div");m.className="ov";m.innerHTML=`<div class="md">${html}</div>`;m.onclick=e=>{if(e.target===m)m.remove()};document.body.appendChild(m);return m}
const closeM=()=>document.querySelectorAll(".ov").forEach(m=>m.remove());
const hdr=(sub,right="")=>`<header class="hd"><img src="${LOGO}" alt="Team PCarrera 4x4"><div><b>Team PCarrera 4x4</b><small>${sub}</small></div>${right}</header><div class="flag"></div>`;
const ce=(v,u)=>u==="distancia"?N(v)+" km":N(v)+" min";
const isRest=w=>w.Deporte==="Descanso";
const isFuerza=w=>w.Deporte==="Fuerza";
const isTest=w=>String(w.EsTest).toUpperCase()==="SI";
const sery=w=>!isRest(w)&&!isFuerza(w)&&/Series|Cambios/.test(w.Tipo);
const isDone=w=>String(w.Completado).toUpperCase()==="SI";
const isClima=w=>String(w.Completado).toUpperCase()==="CLIMA";
const hasEv=w=>w.Eval_Completitud_pct!==""&&w.Eval_Completitud_pct!=null;
const hasAP=w=>w.Completitud_Aguila_pct!==""&&w.Completitud_Aguila_pct!=null;
const aPct=w=>isDone(w)?(hasAP(w)?N(w.Completitud_Aguila_pct):100):0;
const pct=w=>hasEv(w)?N(w.Eval_Completitud_pct):aPct(w);
// Series_Bloques guarda la secuencia COMPLETA (bloque × veces) para que cualquier lector sume bien los km;
// el 1er tramo lleva S (veces que se repite el bloque) y SR (recuperación entre bloques, seg).
const blk=w=>{try{const b=JSON.parse(w.Series_Bloques||"[]");return Array.isArray(b)?b:[]}catch(e){return[]}};
const bset=w=>{const a=blk(w),S=Math.round(N(a[0]&&a[0].S))||1;return S>1&&a.length%S===0?{S,SR:N(a[0].SR),b:a.slice(0,a.length/S)}:{S:1,SR:0,b:a}};
const isAlt=w=>sery(w)&&blk(w).length>0;
const bTxt=b=>(N(b.r)>1?`${N(b.r)}×`:"")+(b.u==="min"?`${N(b.v)}'`:`${N(b.v)} m`);
const bDet=(b,noRec)=>bTxt(b)+(N(b.rmin)?` · ${pace(b.rmin)}${N(b.rmax)?" – "+pace(b.rmax):""} min/km`:"")+(noRec?"":` · rec. ${recF(N(b.rec))}`);
// texto corto de un bloque: 5×1000 m (misma distancia) · 100-200-300-400 m (escalera) · 2×400 m + 4×200 m (libre)
const bsTxt=b=>{const u=b[0].u,un=u==="min"?"'":" m";
 if(b.every(x=>x.u===u&&N(x.v)===N(b[0].v)))return `${b.reduce((s,x)=>s+N(x.r),0)}×${N(b[0].v)}${un}`;
 if(b.every(x=>x.u===u&&N(x.r)===1))return b.map(x=>N(x.v)).join("-")+un;

function cmp(ws,f,t){const h=today();ws=ws.filter(w=>w.Fecha>=f&&w.Fecha<=t&&!isRest(w));const pa=ws.filter(w=>w.Fecha<h),n=pa.length;

const ring=(p,col,lbl)=>{const C=2*Math.PI*40,v=p==null?0:Math.max(0,Math.min(100,p)),tx=p==null?"—":Math.round(p)+"%";
 return `<svg viewBox="0 0 100 100" role="img" aria-label="${esc(lbl)}: ${tx}"><circle cx="50" cy="50" r="40" class="dn0"/>${v?`<circle cx="50" cy="50" r="40" class="dn1" style="stroke:${col};stroke-dasharray:${(C*v/100).toFixed(1)} ${C.toFixed(1)}"/>`:""}<text x="50" y="50">${tx}</text></svg>`};
function donut(o,lbl){const col=o.p==null?"var(--ln)":o.p>=80?"var(--gr)":o.p>=50?"var(--ye)":"var(--rd)";
 const sub=o.n?`${o.dn}/${o.n} cumplidos`+(o.all>o.n?` · ${o.all-o.n} por venir`:""):o.all?`${o.all} programados, sin vencer`:"Sin entrenamientos";
 return `<div class="card dn">${ring(o.p,col,lbl)}<b>${esc(lbl)}</b><span class="muted">${sub}</span></div>`}

 return{n:ws.length,v:s.map(x=>T?x/T*100:null)}}

 const ch=[["m",m[2]],["w",w[2]]].map(([k,x])=>`<button type="button" class="chip ${rtP===k?"on":""}" onclick="rtP='${k}';render()">${esc(x[0].toUpperCase()+x.slice(1))}</button>`).join("");

const cyIn=(cs,t,f,to)=>cs.filter(x=>x.Tipo===t&&x.Inicio<=to&&x.Fin>=f);
const cyRng=x=>`${+x.Inicio.slice(8)} ${MES[+x.Inicio.slice(5,7)-1].slice(0,3)} – ${+x.Fin.slice(8)} ${MES[+x.Fin.slice(5,7)-1].slice(0,3)}`;

function calCells(y,m,cs,cell,fn){const off=(new Date(y,m-1,1).getDay()+6)%7,dim=new Date(y,m,0).getDate();let c="";
 for(let i=0;i<off;i++)c+="<div></div>";
 for(let d=1;d<=dim;d++){const ds=`${y}-${pad(m)}-${pad(d)}`;c+=cell(ds,d);if((off+d)%7===0||d===dim)c+=cyMicro(cs,monday(ds),fn)}

 me={ID:String(a.ID),Nombre:a.Nombre};try{localStorage.setItem("pc_a",JSON.stringify(me))}catch(e){}load()}
function logout(){try{localStorage.removeItem("pc_a");localStorage.removeItem(CK())}catch(e){}me=null;W=[];R=[];TM=[];RP=[];CAF=null;CY=[];PD=[];PDok=0;CT=[];loaded=0;sync="";tab="home";showLogin()}
async function load(){
 if(!loaded){try{const c=JSON.parse(localStorage.getItem(CK()));if(c&&Array.isArray(c.W)){({W,R,TM,RP}=c);CAF=c.CAF||null;CY=c.CY||[];PD=c.PD||[];if(c.UC)UC=c.UC;if(c.D&&c.D.length)DISTS=c.D;loaded=1}}catch(e){}}
 if(loaded){sync="upd";render()}else app.innerHTML=hdr("Águilas")+'<main class="muted">Cargando tu semana…</main>';
 const r0=rev,b=await getBoot(me.ID);let cp=null;
 try{let w,r,tm,p;
 if(b){setDists(b.Distancias);({Entrenamientos:w,Carreras:r,Tiempos:tm,RecordsPersonales:p}=b);setCAF(b.Aguilas,b.Config,b.CAF_Recorrido,b.CAF_Dominio);if(b.Ciclos)CY=cyOf(b.Ciclos,me.ID);if(b.Config)UC=uniCfg(b.Config);
  if("Pedidos" in b)setPD(b.Pedidos);else cp=getS("Pedidos").then(r=>(setPD(r),!!r))} // Apps Script con boot pero sin Pedidos
 else{cp=loadX(); // respaldo (Apps Script sin ?boot): una llamada por pestaña; CAF y ciclos van aparte para no frenar la semana
  [,w,r,tm,p]=await Promise.all([loadDists(),get("Entrenamientos"),get("Carreras"),get("Tiempos"),get("RecordsPersonales")])}
 sync="";
 if(rev!==r0)return render(); // hubo un cambio local mientras llegaban los datos: no se pisa
 W=w.filter(x=>same(x.ID_Aguila,me.ID)).map(x=>({...x,Fecha:nd(x.Fecha)}));
 R=r.filter(x=>same(x.ID_Aguila,me.ID)).map(x=>({...x,Fecha:nd(x.Fecha)}));
 TM=tm.filter(x=>same(x.ID_Aguila,me.ID));
 RP=p.filter(x=>same(x.ID_Aguila,me.ID));loaded=1;saveC();
 const keep=[...app.querySelectorAll("input[id],select[id]")].map(e=>[e.id,e.value]); // no borrar lo que el águila esté escribiendo
 render();keep.forEach(([i,v])=>{const e=document.getElementById(i);if(e)e.value=v});
 if(await cp){saveC();if(tab!=="races"&&tab!=="uni")render()}
 uPop()}
 catch(e){if(loaded){sync="err";render()}else app.innerHTML=hdr("")+'<main><div class="card">No se pudo conectar. <button class="btn pri" onclick="load()">Reintentar</button></div></main>'}}
// Maratón CAF: necesita Aguilas (CAF_Distancia), Config (fecha) y las dos pestañas CAF. Si Aguilas o Config fallan se queda lo de caché.
async function loadX(){const[a,c,rc,dm,cy,pd]=await Promise.all([getS("Aguilas"),getS("Config"),getS("CAF_Recorrido"),getS("CAF_Dominio"),getS("Ciclos"),getS("Pedidos")]);
 if(cy&&me)CY=cyOf(cy,me.ID);if(c)UC=uniCfg(c);setPD(pd);return setCAF(a,c,rc,dm)||!!cy||!!pd}
// pedidos del uniforme de este águila. PDok = ya llegaron del servidor (el pop up no sale con datos de caché ni si falta la pestaña)
function setPD(r){if(!Array.isArray(r)||!me)return;PD=r.filter(x=>same(x.ID_Aguila,me.ID)).map(x=>({...x,Fecha:nd(x.Fecha),Pago_Fecha:nd(x.Pago_Fecha)}));PDok=1}
function setCAF(a,c,rc,dm){if(!a||!c||!me)return 0;const yo=a.find(x=>same(x.ID,me.ID))||{},d=cafD(yo.CAF_Distancia),cf=cafCfg(c),o=CAF||{};
 CAF={d,f:cf.f,n:cf.n,pts:rc?cafPts(rc,d):(o.d===d&&o.pts)||[],h:dm?cafHist(dm,me.ID):(o.h||[])};return 1}
function cafHome(){if(!CAF||!CAF.d||(CAF.f&&CAF.f<today()))return "";return cafBox(CAF,"ca")}
function render(){
 const nav=[["home","🏠","Inicio"],["cal","📅","Calendario"],["races","🏁","Carreras"],["tiempos","⏱️","Tus tiempos"]].map(([k,i,t])=>`<button class="${tab===k?"on":""}" onclick="tab='${k}';render();scrollTo(0,0)"><span>${i}</span>${t}</button>`).join("");
 app.innerHTML=hdr(esc(me.Nombre)+syncTxt(),'<button class="btn s" onclick="load()">↻</button><button class="btn s" onclick="logout()">Salir</button>')+`<main>${views[tab]()}</main><nav class="bar">${nav}</nav>`}
function wCard(w,big){
 if(isRest(w))return `<div class="card wk rest"><div class="tag rest">Descanso · ${esc(w.Tipo)}</div><div class="num">Día de recuperación</div>${detHTML(w)}<span class="muted">El coach indicó este descanso. No necesitas marcar nada.</span></div>`;
 const cls=isTest(w)?"test":"",tagPre=isTest(w)?"TEST · ":"";
 let act;
 if(isDone(w))act=`<button class="btn ghost" onclick="pctUI('${w.ID}')">✓ Completado · ${aPct(w)}% · cambiar %</button><button class="btn" onclick="setEstado('${w.ID}','NO')">Desmarcar</button>`;
 else if(isClima(w))act=`<div class="row"><span class="bd clima">☁️ No realizado por clima</span><button class="btn s" onclick="setEstado('${w.ID}','NO')">Deshacer</button></div>`;
 else act=`<button class="btn pri" onclick="pctUI('${w.ID}')">Marcar como completado</button><button class="btn ghost" onclick="setEstado('${w.ID}','CLIMA')">No realizado por clima</button>`;
 return `<div class="card wk ${cls} ${big?"big":""} ${isDone(w)?"ok":""}"><div class="tag ${cls}">${tagPre}${esc(w.Deporte)}${w.Tipo?" · "+esc(w.Tipo):""}</div><div class="num${isAlt(w)?" alt":""}">${main(w)}</div>${detHTML(w)}${evalHTML(w)}${act}</div>`}
async function setEstado(id,v,p=""){const w=W.find(x=>x.ID===id);w.Completado=v;w.Completitud_Aguila_pct=p;rev++;saveC();render();

function pctUI(id){const w=W.find(x=>x.ID===id),v=isDone(w)&&hasAP(w)?N(w.Completitud_Aguila_pct):100;
 modal(`<h2>¿Cuánto completaste?</h2><div class="muted">${esc(w.Deporte)}${w.Tipo?" · "+esc(w.Tipo):""} · ${main(w)}</div><div class="num" id="pv" style="text-align:center">${v}%</div>
 <div class="pq">${[25,50,75,100].map(n=>`<button type="button" class="chip" onclick="setP(${n})">${n}%</button>`).join("")}</div>
 <input id="pp" type="range" min="5" max="100" step="5" value="${v}" oninput="$('#pv').textContent=this.value+'%'">
 ${hasEv(w)?`<div class="muted" style="font-size:13px">El coach ya evaluó este entrenamiento con ${N(w.Eval_Completitud_pct)}%. Ese es el que cuenta.</div>`:""}
 <button class="btn pri" onclick="savePct('${id}')">Guardar</button>`)}

function home(){
 const t=today(),tw=W.filter(w=>w.Fecha===t),mon=monday(t),we=addDays(mon,6),mes=t.slice(0,7),ml=MES[+mes.slice(5)-1];
 const strip=[0,1,2,3,4,5,6].map(i=>{const d=addDays(mon,i),real=W.filter(w=>w.Fecha===d&&!isRest(w));
  const st=!real.length?"rest":real.every(isDone)?"done":d<t?"miss":"pend";
  return `<div class="dy ${st} ${d===t?"now":""}" onclick="go('${d}')"><small>${DIAS[i].slice(0,3)}</small><b>${+d.slice(8)}</b><i>${{done:"✓",rest:"·",miss:"✕",pend:"●"}[st]}</i></div>`}).join("");
 const dn=W.filter(w=>w.Fecha>=mon&&w.Fecha<=we&&!isRest(w)&&pct(w)>0);
 const k=dn.reduce((s,w)=>s+km(w),0),ds=dn.reduce((s,w)=>s+dsn(w),0);
 const nx=R.filter(r=>r.Estado==="Aprobada"&&r.Fecha>=t).sort((a,b)=>a.Fecha<b.Fecha?-1:1)[0];

 return `<h2>Hoy · ${fmtL(t)}</h2>`+(tw.length?tw.map(w=>wCard(w,1)).join(""):`<div class="card wk"><div class="tag">Descanso</div><div class="num">Hoy toca recuperar</div><span class="muted">Estírate, hidrátate y come bien, águila.</span></div>`)

 +rtSec(W,[mes+"-01",mes+"-31",ml],[mon,we,"Esta semana"])

 +(nx?`<div class="card"><div class="tag">Próxima carrera</div><div class="num">${days===0?"¡Hoy!":days}</div><b>${days===0?"":(days===1?"día":"días")+" para "}${esc(nx.Nombre_Carrera)}</b><div class="muted">${fmtL(nx.Fecha)} · ${N(nx.Distancia_km)} km · ${esc(nx.Sitio)}</div></div>`:`<div class="card"><div class="tag">Próxima carrera</div><span class="muted">Aún no tienes carreras aprobadas. Agrégala en la pestaña Carreras.</span></div>`)}

 try{if(sessionStorage.getItem("pc_uni"))return;sessionStorage.setItem("pc_uni","1")}catch(e){}
 modal(`<div class="upop"><img src="${uniImg("franela","Negro")}" alt="Uniforme Team PCarrera 4x4"><h2 style="margin:12px 0 4px">PIDE tu uniforme 🦅</h2>
 <div class="muted">Top ${eur(UC.p.top)} · Franela manga corta ${eur(UC.p.franela)} · Franelilla ${eur(UC.p.franelilla)}. Blanco o negro, con tu nombre. Pedidos hasta el ${fmtL(UC.cierre)}.</div>
 <button class="btn pri" onclick="closeM();tab='uni';render();scrollTo(0,0)">Pedir ahora</button><button class="btn ghost" onclick="closeM()">Más tarde</button></div>`)}
function uSel(k,f,v){US[k][f]=v;render()}
function uAdd(k){const s=US[k];if(!s.t)return toast("Elige la talla");CT.push({k,c:s.c,t:s.t,n:s.n.trim()});s.n="";render();toast(uN(k)+" agregado ✓")}
const ctTot=()=>CT.reduce((a,x)=>a+UC.p[x.k],0);
function uni(){const open=uOpen(),G=pdGroups(PD);
 const prev=G.map(g=>`<div class="card"><div class="mn" style="margin:0 0 6px"><div class="tag" style="margin:0">👕 Pedido del ${fmtL(g.f)}</div><span class="bd ${UEST[g.e]||"w"}">${esc(g.e)}</span></div>
 ${g.it.map(x=>`<div class="row"><span>${uItem(x)}</span><b>${eur(x.Precio_EUR)}</b></div>`).join("")}<div class="row"><span>Total</span><b>${eur(g.t)}</b></div>
 ${g.ref?`<div class="row"><span>Pago</span><b>Ref. ${esc(g.ref)}${g.pf?" · "+fmtL(g.pf):""}</b></div>`:`${payBox(g.t)}<label>Referencia del pago</label><input id="pr_${g.id}" inputmode="numeric"><label>Día del pago</label><input id="pf_${g.id}" type="date"><button class="btn pri" onclick="uPay('${g.id}')">Reportar pago</button>`}
 ${g.e==="Pedido"&&open?`<button class="btn ghost" onclick="uCancel('${g.id}')">Cancelar este pedido</button>`:""}</div>`).join("");
 const cat=UNI.map(([k,n,ts])=>{const s=US[k];return `<div class="card uni"><img src="${uniImg(k,s.c)}" alt="${esc(n)} ${s.c.toLowerCase()}">
 <div class="mn" style="margin:10px 0 0"><b style="font-size:19px">${esc(n)}</b><div class="num" style="font-size:28px">${eur(UC.p[k])}</div></div>
 <label>Color</label><div class="chips">${UNI_COL.map(c=>`<button type="button" class="chip ${s.c===c?"on":""}" onclick="uSel('${k}','c','${c}')">${c}</button>`).join("")}</div>
 <label>Talla</label><div class="chips">${ts.map(t=>`<button type="button" class="chip ${s.t===t?"on":""}" onclick="uSel('${k}','t','${t}')">${t}</button>`).join("")}</div>
 <label>Nombre a estampar</label><input id="un_${k}" value="${esc(s.n)}" oninput="US.${k}.n=this.value" placeholder="Tu nombre, como quieres que salga">
 <button class="btn pri" onclick="uAdd('${k}')">+ Agregar al pedido</button></div>`}).join("");
 const cart=CT.length?`<div class="card"><div class="tag">Tu pedido nuevo</div>${CT.map((x,i)=>`<div class="row"><span>${esc(uN(x.k))} · ${x.c} · ${x.t}${x.n?` · “${esc(x.n)}”`:""}</span><b>${eur(UC.p[x.k])} <button class="btn s" onclick="CT.splice(${i},1);render()">✕</button></b></div>`).join("")}
 <div class="row"><span>Total</span><b>${eur(ctTot())}</b></div>${payBox(ctTot())}
 <label>Referencia del pago</label><input id="upr" inputmode="numeric" value="${esc(UP.r)}" oninput="UP.r=this.value"><label>Día del pago</label><input id="upf" type="date" value="${esc(UP.f)}" oninput="UP.f=this.value">
 <div class="muted" style="font-size:13px">¿Todavía no pagaste? Deja estos dos vacíos y repórtalo después aquí mismo.</div>
 <button class="btn pri" onclick="uSend()">Enviar pedido · ${eur(ctTot())}</button></div>`:"";
 return `<button class="btn s" onclick="tab='home';render()">‹ Inicio</button><h2 style="margin-top:12px">Tu uniforme</h2>`+prev
 +(open?(G.length?`<h2>Pedir más</h2>`:"")+`<div class="muted" style="margin:-4px 0 12px">Pedidos hasta el ${fmtL(UC.cierre)}. Agrega cada prenda con su color, talla y nombre.</div>`+cat+cart
 :`<div class="card muted">Los pedidos de uniforme cerraron el ${fmtL(UC.cierre)}.</div>`)}
async function uSend(){if(ubusy||!CT.length)return;const r=UP.r.trim(),f=UP.f;
 if(!r!==!f)return toast("Pon la referencia y el día del pago, o deja los dos vacíos");
 const id=uid("U"),t=today(),rows=CT.map((x,i)=>({ID:id+"-"+(i+1),ID_Pedido:id,ID_Aguila:me.ID,Fecha:t,Prenda:uN(x.k),Color:x.c,Talla:x.t,Nombre_Estampado:x.n,Precio_EUR:UC.p[x.k],Pago_Referencia:r,Pago_Fecha:f,Estado:r?"Pago reportado":"Pedido"}));
 ubusy=1;toast("Enviando pedido…");
 try{for(const x of rows){const o=await post({action:"add",sheet:"Pedidos",data:x});if(!o||!o.ok)throw 0;PD.push(x)}
 CT=[];UP={r:"",f:""};toast("¡Pedido enviado, águila! 🦅")}catch(e){toast("No se pudo enviar completo. Revisa tu pedido y avísale a Gladimir")}
 ubusy=0;rev++;saveC();render();scrollTo(0,0)}
async function uPay(id){const r=$("#pr_"+id).value.trim(),f=$("#pf_"+id).value;if(!r||!f)return toast("Pon la referencia y el día del pago");
 const d={Pago_Referencia:r,Pago_Fecha:f,Estado:"Pago reportado"};
 try{for(const x of PD.filter(x=>x.ID_Pedido===id)){const o=await post({action:"update",sheet:"Pedidos",id:x.ID,data:d});if(!o||!o.ok)throw 0;Object.assign(x,d)}
 rev++;saveC();render();toast("Pago reportado ✓ El coach lo confirma")}catch(e){toast("No se pudo guardar")}}
async function uCancel(id){if(!confirm("¿Cancelar este pedido?"))return;
 try{for(const x of PD.filter(x=>x.ID_Pedido===id)){await post({action:"delete",sheet:"Pedidos",id:x.ID});PD=PD.filter(y=>y!==x)}rev++;saveC();render();toast("Pedido cancelado")}catch(e){toast("No se pudo cancelar")}}
init();
</script></body></html>
