<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Águilas · Team PCarrera 4x4</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23d62839%22/%3E%3Cpath%20fill%3D%22%23fff%22%20d%3D%22M32%2010c3%200%205%202%205%205l1%202%202-1%2021-6c-2%2010-8%2019-16%2024l-4%202%203%2012-12-7-12%207%203-12-4-2C10%2027%204%2018%202%2010l21%206%202%201%201-2c0-3%202-6%206-6z%22%20transform%3D%22translate%280%206%29%20scale%281%29%22/%3E%3Cpath%20fill%3D%22%23d62839%22%20d%3D%22M36%2021l6%203-6%201z%22/%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2219%22%20r%3D%221.4%22%20fill%3D%22%23d62839%22/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>:root{--bg:#0d0d0d;--c1:#171717;--c2:#232323;--ln:#2f2f2f;--tx:#f4f4f4;--mu:#9b9b9b;--rd:#d62839;--gr:#2fbf71;--ye:#ffcc00;--bl:#1d4ed8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
h1,h2,h3,.num,.tag,.hd b{font-family:'Barlow Condensed','Arial Narrow',Impact,sans-serif;text-transform:uppercase;letter-spacing:.04em;margin:0;font-weight:800}
h2{font-size:26px;margin-bottom:12px}
header.hd{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:#000;position:sticky;top:0;z-index:5}
.hd img{height:46px}.hd div{flex:1;line-height:1.1}.hd b{font-size:21px;display:block}.hd small{color:var(--mu)}
.flag{height:4px;background:linear-gradient(90deg,var(--ye) 33.33%,var(--bl) 33.33% 66.66%,var(--rd) 66.66%)}
main{padding:16px;max-width:680px;margin:auto}
.card{background:var(--c1);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:14px}
.wk.big{border-color:var(--rd);background:linear-gradient(160deg,#2a1013,var(--c1))}
.wk.ok{border-color:var(--gr)}
.tag{color:var(--rd);font-size:16px}
.num{font-size:68px;line-height:1;margin:4px 0 10px}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--ln)}
.row span{color:var(--mu)}.row b{text-align:right;font-weight:600}
.btn{width:100%;padding:14px;border:0;border-radius:12px;font:700 16px 'Barlow',sans-serif;background:var(--c2);color:var(--tx);margin-top:12px;cursor:pointer}
.pri{background:var(--rd)}.ghost{background:transparent;border:1px solid var(--gr);color:var(--gr)}
.btn.s{width:auto;padding:8px 12px;margin:0;font-size:14px}
.btn.danger{color:var(--rd)}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--ln);background:#0f0f0f;color:var(--tx);font:16px 'Barlow',sans-serif;margin:4px 0 10px}
label{font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
input[type=range]{padding:0;accent-color:var(--rd);height:36px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chip{padding:9px 14px;border-radius:99px;border:1px solid var(--ln);background:var(--c2);color:var(--tx);font:600 14px 'Barlow',sans-serif;cursor:pointer}
.chip.on{background:var(--rd);border-color:var(--rd)}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dy{background:var(--c2);border-radius:12px;padding:8px 0;text-align:center;border:1px solid transparent;cursor:pointer}
.dy small{display:block;color:var(--mu);text-transform:uppercase;font-size:11px}.dy b{font-size:18px}.dy i{display:block;font-style:normal;font-size:13px}
.dy.done{background:#10301f;color:var(--gr)}.dy.pend{color:var(--ye)}.dy.miss{color:var(--rd)}.dy.now{border-color:var(--tx)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cd{aspect-ratio:1;background:var(--c2);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;cursor:pointer}
.cd.now{border:1px solid var(--tx)}.cd.sel{background:var(--rd)}
.cd i{width:6px;height:6px;border-radius:9px;margin-top:3px}.cd i.g{background:var(--gr)}.cd i.r{background:var(--ye)}
.cal .h{color:var(--mu);font-size:12px}
nav.bar{position:fixed;bottom:0;left:0;right:0;display:flex;background:#000;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.bar button{flex:1;padding:10px 4px;background:none;border:0;color:var(--mu);font:600 12px 'Barlow',sans-serif}
nav.bar button.on{color:var(--tx)}nav.bar span{display:block;font-size:22px}
.ov{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.md{background:var(--c1);width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:99px;z-index:30;font-weight:700;max-width:90vw;text-align:center}
.bd{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--c2)}.bd.ok{color:var(--gr)}.bd.w{color:var(--ye)}.bd.no{color:var(--rd)}
.dot{width:16px;height:16px;border-radius:50%;display:inline-block;background:#555}
.s-g{background:var(--gr)}.s-y{background:var(--ye)}.s-r{background:var(--rd)}
.mn{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.mn>button{background:var(--c2);border:0;color:var(--tx);width:44px;height:44px;border-radius:12px;font-size:18px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stats .card{text-align:center;margin:0}.stats .num{font-size:44px;margin:0}
.muted{color:var(--mu)}
.it{border-top:1px solid var(--ln);padding:10px 0}.it:first-child{border-top:0}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.ath{display:flex;align-items:center;gap:12px;cursor:pointer}.ath div{flex:1}
.wk.test{border-color:var(--bl);background:linear-gradient(160deg,#0e1a33,var(--c1))}
.wk.rest{border-color:var(--ye);background:linear-gradient(160deg,#2a2308,var(--c1))}
.tag.test{color:var(--bl)}.tag.rest{color:var(--ye)}
.bd.clima{color:var(--bl)}
.pacer{display:flex;gap:6px}.pacer input{flex:1;margin:0}.pacer button{width:42px;flex:none;margin:0;border-radius:10px;border:1px solid var(--ln);background:var(--c2);color:var(--tx);font:700 16px 'Barlow',sans-serif}
.rgrid .row{align-items:center}
.rgrid input{margin:0}
.cd i.b{background:var(--bl)}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1}
.pacer select{width:92px;flex:none;margin:0;padding:12px 6px}
.tpl-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--ln)}
.tpl-row b{flex:1;font-weight:600}

.cd-n{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}.cd-n .num{font-size:52px;margin:0}.cd-n small{color:var(--mu);text-transform:uppercase;font-size:11px}
.dots{display:flex;gap:2px;justify-content:center;margin-top:3px}
.num.alt{font-size:40px}.pq{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 4px}.pq .chip{text-align:center}
</style></head><body><div id="app"></div>

const DIAS=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const MES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const RUTAS=["Rectorado","Vuelta Larga","Pista","Pista Montañera","Cortafuegos","Ruta CAF","Bombillo","Infinito","La Julia","Sabas Nieves"];
const DIST_DEF=[["200m","200 m"],["300m","300 m"],["400m","400 m"],["500m","500 m"],["1K","1 km"],["2K","2 km"],["2Kd","2 km con desnivel"],["3K","3 km"],["5K","5 km"],["5000p","5 000 m (pista)"],["5Kd","5 km con desnivel"],["10K","10 km"],["10000p","10 000 m (pista)"],["MM","Media maratón"],["MA","Maratón"]];
let DISTS=DIST_DEF.slice();
async function loadDists(){try{const r=await get("Distancias");const l=r.filter(x=>x.ID&&x.Nombre).map(x=>[String(x.ID).trim(),String(x.Nombre).trim(),N(x.Orden)]);
 if(l.length){l.sort((a,b)=>a[2]-b[2]);DISTS=l.map(x=>[x[0],x[1]])}}catch(e){}}
const dLbl=k=>(DISTS.find(d=>d[0]===k)||["","?"])[1];
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const nd=v=>{if(!v)return"";v=String(v);if(/^\d{4}-\d\d-\d\d$/.test(v))return v;const d=new Date(v);return isNaN(d)?"":iso(d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((parseD(a)-parseD(b))/864e5);
const monday=s=>{const d=parseD(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
const today=()=>iso(new Date());
const fmtL=s=>{const d=parseD(s);return d.getDate()+" de "+MES[d.getMonth()]};
const pace=s=>{s=+s;return s?Math.floor(s/60)+":"+pad(s%60):""};
const parsePace=t=>{const m=String(t).trim().match(/^(\d+):(\d\d)$/);return m?+m[1]*60+ +m[2]:""};
const recF=s=>Math.floor(s/60)+":"+pad(s%60);
const rtime=s=>{s=+s;if(!s)return"";const h=Math.floor(s/3600);s%=3600;return(h?h+":"+pad(Math.floor(s/60)):Math.floor(s/60))+":"+pad(s%60)};
const parseRtime=t=>{t=String(t).trim();let m=t.match(/^(\d+):(\d\d):(\d\d)$/);if(m)return(+m[1])*3600+(+m[2])*60+ +m[3];m=t.match(/^(\d+):(\d\d)$/);return m?(+m[1])*60+ +m[2]:""};
const N=v=>v===""||v==null||isNaN(v)?0:+v;
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const same=(a,b)=>{a=String(a).trim();b=String(b).trim();return a===b||(a!==""&&!isNaN(a)&&!isNaN(b)&&Number(a)===Number(b))};
async function get(sheet){const r=await fetch(API+"?sheet="+sheet);return r.json()}
async function post(o){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(o)});return r.json()}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function modal(html){const m=document.createElement("div");m.className="ov";m.innerHTML=`<div class="md">${html}</div>`;m.onclick=e=>{if(e.target===m)m.remove()};document.body.appendChild(m);return m}
const closeM=()=>document.querySelectorAll(".ov").forEach(m=>m.remove());
const hdr=(sub,right="")=>`<header class="hd"><img src="${LOGO}" alt="Team PCarrera 4x4"><div><b>Team PCarrera 4x4</b><small>${sub}</small></div>${right}</header><div class="flag"></div>`;
const ce=(v,u)=>u==="distancia"?N(v)+" km":N(v)+" min";
const isRest=w=>w.Deporte==="Descanso";
const isFuerza=w=>w.Deporte==="Fuerza";
const isTest=w=>String(w.EsTest).toUpperCase()==="SI";
const sery=w=>!isRest(w)&&!isFuerza(w)&&/Series|Cambios/.test(w.Tipo);
const isDone=w=>String(w.Completado).toUpperCase()==="SI";
const isClima=w=>String(w.Completado).toUpperCase()==="CLIMA";
const hasEv=w=>w.Eval_Completitud_pct!==""&&w.Eval_Completitud_pct!=null;
const hasAP=w=>w.Completitud_Aguila_pct!==""&&w.Completitud_Aguila_pct!=null;
const aPct=w=>isDone(w)?(hasAP(w)?N(w.Completitud_Aguila_pct):100):0;
const pct=w=>hasEv(w)?N(w.Eval_Completitud_pct):aPct(w);
const blk=w=>{try{const b=JSON.parse(w.Series_Bloques||"[]");return Array.isArray(b)?b:[]}catch(e){return[]}};
const isAlt=w=>sery(w)&&blk(w).length>0;
const bTxt=b=>`${N(b.r)}×`+(b.u==="min"?`${N(b.v)}'`:`${N(b.v)} m`);
const bDet=b=>bTxt(b)+(N(b.rmin)?` · ${pace(b.rmin)}${N(b.rmax)?" – "+pace(b.rmax):""} min/km`:"")+` · rec. ${recF(N(b.rec))}`;
const main=w=>isRest(w)?esc(w.Tipo):isFuerza(w)?(N(w.Valor_Tiempo_min)?w.Valor_Tiempo_min+" min":"—"):isAlt(w)?blk(w).map(bTxt).join(" + "):sery(w)?`${w.Series_Repeticiones}×`+(w.Modalidad==="tiempo"?`${w.Valor_Tiempo_min}'`:`${w.Series_Distancia_m} m`):(w.Modalidad==="tiempo"?`${w.Valor_Tiempo_min} min`:`${w.Valor_Distancia_km} km`);
const plKm=w=>(isRest(w)||isFuerza(w)||w.Modalidad==="tiempo")?0:isAlt(w)?blk(w).reduce((s,b)=>s+(b.u==="min"?0:N(b.r)*N(b.v)/1000),0):sery(w)?N(w.Series_Repeticiones)*N(w.Series_Distancia_m)/1000:N(w.Valor_Distancia_km);
// km/desnivel confirmados: el real que cargó el coach; si no, lo planificado × el % que manda (coach > águila)
const km=w=>N(w.Distancia_Real_km)||plKm(w)*pct(w)/100;
const dsn=w=>N(w.Desnivel_Real_m)||N(w.Desnivel_m)*pct(w)/100;
const det=w=>{const d=[];
if(isRest(w)){if(w.Observaciones)d.push(["Obs.",w.Observaciones]);return d}
if(isFuerza(w)){if(w.Ruta_Circuito)d.push(["Rutina",w.Ruta_Circuito]);if(w.Microciclo)d.push(["Microciclo",w.Microciclo]);if(N(w.Calentamiento_min))d.push(["Calentamiento",ce(w.Calentamiento_min,w.Calentamiento_unidad)]);if(N(w.Enfriamiento_min))d.push(["Enfriamiento",ce(w.Enfriamiento_min,w.Enfriamiento_unidad)]);if(w.Observaciones)d.push(["Obs.",w.Observaciones]);return d}
if(w.Ruta_Circuito)d.push(["Ruta",w.Ruta_Circuito]);
if(w.Ritmo_Min)d.push(["Ritmo",pace(w.Ritmo_Min)+(w.Ritmo_Max?" – "+pace(w.Ritmo_Max):"")+" min/km"]);
if(N(w.Desnivel_m))d.push(["Desnivel","+"+w.Desnivel_m+" m"]);
if(isAlt(w))blk(w).forEach((b,i)=>d.push(["Bloque "+(i+1),bDet(b)]));
else if(sery(w))d.push(["Recuperación",recF(N(w.Series_Recuperacion_seg))+" min"]);
if(w.Microciclo)d.push(["Microciclo",w.Microciclo]);
if(N(w.Calentamiento_min))d.push(["Calentamiento",ce(w.Calentamiento_min,w.Calentamiento_unidad)]);
if(N(w.Enfriamiento_min))d.push(["Enfriamiento",ce(w.Enfriamiento_min,w.Enfriamiento_unidad)]);
if(w.Observaciones)d.push(["Obs.",w.Observaciones]);return d};
const detHTML=w=>det(w).map(([k,v])=>`<div class="row"><span>${k}</span><b>${esc(v)}</b></div>`).join("");
const hasDom=w=>w.Eval_Dominio_Ritmo_pct!==""&&w.Eval_Dominio_Ritmo_pct!=null;
const evX=w=>[["Biomecánica",String(w.Eval_Biomecanica??"").trim()],["Ritmo",String(w.Eval_Ritmo??"").trim()],["Dominio ritmo competitivo",hasDom(w)?N(w.Eval_Dominio_Ritmo_pct)+"%":""]].filter(x=>x[1]);
const evalHTML=w=>hasEv(w)?`<div class="row"><span>🦅 Coach</span><b>${w.Eval_Completitud_pct}% · ${N(w.Eval_PRs)} PR${N(w.Distancia_Real_km)?` · ${w.Distancia_Real_km} km`:""}${N(w.Desnivel_Real_m)?` · +${w.Desnivel_Real_m} m`:""}</b></div>${evX(w).map(([k,v])=>`<div class="row"><span>${k}</span><b>${esc(v)}</b></div>`).join("")}${w.Eval_Nota?`<div class="row"><span>Nota</span><b>${esc(w.Eval_Nota)}</b></div>`:""}`:"";

let me=null,W=[],R=[],TM=[],RP=[],tab="home",calM=null,sel=null;
const app=$("#app");
const views={home,cal,races,tiempos};

function init(){try{const s=JSON.parse(localStorage.getItem("pc_a"));if(s&&s.ID){me=s;return load()}}catch(e){}showLogin()}
async function showLogin(){
 app.innerHTML=hdr("Águilas")+'<main class="muted">Cargando…</main>';
 try{const A=(await get("Aguilas")).filter(a=>a.Nombre&&String(a.Activo).toUpperCase()!=="NO");window._A=A;
 app.innerHTML=hdr("Águilas")+`<main><h2>Entra, águila 🦅</h2><div class="card"><label>Tu nombre</label><select id="ln">${A.map(a=>`<option value="${esc(a.ID)}">${esc(a.Nombre)}</option>`).join("")}</select><label>PIN</label><input id="lp" type="password" inputmode="numeric" placeholder="••••"><button class="btn pri" onclick="doLogin()">Entrar</button></div></main>`}
 catch(e){app.innerHTML=hdr("")+'<main><div class="card">No se pudo conectar con el servidor. <button class="btn pri" onclick="showLogin()">Reintentar</button></div></main>'}}
function doLogin(){const a=_A.find(x=>String(x.ID)===$("#ln").value);if(!a||!same(a.PIN,$("#lp").value))return toast("PIN incorrecto");
 me={ID:String(a.ID),Nombre:a.Nombre};try{localStorage.setItem("pc_a",JSON.stringify(me))}catch(e){}load()}
function logout(){try{localStorage.removeItem("pc_a")}catch(e){}me=null;tab="home";showLogin()}
async function load(){
 app.innerHTML=hdr("Águilas")+'<main class="muted">Cargando tu semana…</main>';
 try{await loadDists();
 const[w,r,tm,p]=await Promise.all([get("Entrenamientos"),get("Carreras"),get("Tiempos"),get("RecordsPersonales")]);
 W=w.filter(x=>same(x.ID_Aguila,me.ID)).map(x=>({...x,Fecha:nd(x.Fecha)}));
 R=r.filter(x=>same(x.ID_Aguila,me.ID)).map(x=>({...x,Fecha:nd(x.Fecha)}));
 TM=tm.filter(x=>same(x.ID_Aguila,me.ID));
 RP=p.filter(x=>same(x.ID_Aguila,me.ID));render()}
 catch(e){app.innerHTML=hdr("")+'<main><div class="card">No se pudo conectar. <button class="btn pri" onclick="load()">Reintentar</button></div></main>'}}
function render(){
 const nav=[["home","🏠","Inicio"],["cal","📅","Calendario"],["races","🏁","Carreras"],["tiempos","⏱️","Tus tiempos"]].map(([k,i,t])=>`<button class="${tab===k?"on":""}" onclick="tab='${k}';render();scrollTo(0,0)"><span>${i}</span>${t}</button>`).join("");
 app.innerHTML=hdr(esc(me.Nombre),'<button class="btn s" onclick="load()">↻</button><button class="btn s" onclick="logout()">Salir</button>')+`<main>${views[tab]()}</main><nav class="bar">${nav}</nav>`}
function wCard(w,big){
 if(isRest(w))return `<div class="card wk rest"><div class="tag rest">Descanso · ${esc(w.Tipo)}</div><div class="num">Día de recuperación</div>${detHTML(w)}<span class="muted">El coach indicó este descanso. No necesitas marcar nada.</span></div>`;
 const cls=isTest(w)?"test":"",tagPre=isTest(w)?"TEST · ":"";
 let act;
 if(isDone(w))act=`<button class="btn ghost" onclick="pctUI('${w.ID}')">✓ Completado · ${aPct(w)}% · cambiar %</button><button class="btn" onclick="setEstado('${w.ID}','NO')">Desmarcar</button>`;
 else if(isClima(w))act=`<div class="row"><span class="bd clima">☁️ No realizado por clima</span><button class="btn s" onclick="setEstado('${w.ID}','NO')">Deshacer</button></div>`;
 else act=`<button class="btn pri" onclick="pctUI('${w.ID}')">Marcar como completado</button><button class="btn ghost" onclick="setEstado('${w.ID}','CLIMA')">No realizado por clima</button>`;
 return `<div class="card wk ${cls} ${big?"big":""} ${isDone(w)?"ok":""}"><div class="tag ${cls}">${tagPre}${esc(w.Deporte)}${w.Tipo?" · "+esc(w.Tipo):""}</div><div class="num${isAlt(w)?" alt":""}">${main(w)}</div>${detHTML(w)}${evalHTML(w)}${act}</div>`}
async function setEstado(id,v,p=""){const w=W.find(x=>x.ID===id);w.Completado=v;w.Completitud_Aguila_pct=p;render();
 try{await post({action:"update",sheet:"Entrenamientos",id,data:{Completado:v,Completitud_Aguila_pct:p}});if(v==="SI")toast("¡Bien hecho, águila! 🦅")}catch(e){toast("No se pudo guardar")}}
function pctUI(id){const w=W.find(x=>x.ID===id),v=isDone(w)&&hasAP(w)?N(w.Completitud_Aguila_pct):100;
 modal(`<h2>¿Cuánto completaste?</h2><div class="muted">${esc(w.Deporte)}${w.Tipo?" · "+esc(w.Tipo):""} · ${main(w)}</div><div class="num" id="pv" style="text-align:center">${v}%</div>
 <div class="pq">${[25,50,75,100].map(n=>`<button type="button" class="chip" onclick="setP(${n})">${n}%</button>`).join("")}</div>
 <input id="pp" type="range" min="5" max="100" step="5" value="${v}" oninput="$('#pv').textContent=this.value+'%'">
 ${hasEv(w)?`<div class="muted" style="font-size:13px">El coach ya evaluó este entrenamiento con ${N(w.Eval_Completitud_pct)}%. Ese es el que cuenta.</div>`:""}
 <button class="btn pri" onclick="savePct('${id}')">Guardar</button>`)}
function setP(n){$("#pp").value=n;$("#pv").textContent=n+"%"}
function savePct(id){const p=+$("#pp").value;closeM();setEstado(id,"SI",p)}
function go(d){tab="cal";sel=d;calM=d.slice(0,7);render();scrollTo(0,0)}
function home(){
 const t=today(),tw=W.filter(w=>w.Fecha===t),mon=monday(t),we=addDays(mon,6);
 const strip=[0,1,2,3,4,5,6].map(i=>{const d=addDays(mon,i),real=W.filter(w=>w.Fecha===d&&!isRest(w));
  const st=!real.length?"rest":real.every(isDone)?"done":d<t?"miss":"pend";
  return `<div class="dy ${st} ${d===t?"now":""}" onclick="go('${d}')"><small>${DIAS[i].slice(0,3)}</small><b>${+d.slice(8)}</b><i>${{done:"✓",rest:"·",miss:"✕",pend:"●"}[st]}</i></div>`}).join("");
 const dn=W.filter(w=>w.Fecha>=mon&&w.Fecha<=we&&!isRest(w)&&pct(w)>0);
 const k=dn.reduce((s,w)=>s+km(w),0),ds=dn.reduce((s,w)=>s+dsn(w),0);
 const nx=R.filter(r=>r.Estado==="Aprobada"&&r.Fecha>=t).sort((a,b)=>a.Fecha<b.Fecha?-1:1)[0];
 const days=nx?diff(nx.Fecha,t):0;
 return `<h2>Hoy · ${fmtL(t)}</h2>`+(tw.length?tw.map(w=>wCard(w,1)).join(""):`<div class="card wk"><div class="tag">Descanso</div><div class="num">Hoy toca recuperar</div><span class="muted">Estírate, hidrátate y come bien, águila.</span></div>`)
 +`<h2>Tu semana</h2><div class="card"><div class="strip">${strip}</div></div>`
 +`<div class="stats"><div class="card"><div class="num">${k.toFixed(1)}</div><span class="muted">km esta semana</span></div><div class="card"><div class="num">+${Math.round(ds)}</div><span class="muted">m de desnivel</span></div></div>`
 +(nx?`<div class="card"><div class="tag">Próxima carrera</div><div class="num">${days===0?"¡Hoy!":days}</div><b>${days===0?"":(days===1?"día":"días")+" para "}${esc(nx.Nombre_Carrera)}</b><div class="muted">${fmtL(nx.Fecha)} · ${N(nx.Distancia_km)} km · ${esc(nx.Sitio)}</div></div>`:`<div class="card"><div class="tag">Próxima carrera</div><span class="muted">Aún no tienes carreras aprobadas. Agrégala en la pestaña Carreras.</span></div>`)}
function mv(n){const[y,m]=calM.split("-").map(Number),d=new Date(y,m-1+n,1);calM=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;sel=null;render()}
function cal(){calM=calM||today().slice(0,7);const[y,m]=calM.split("-").map(Number),off=(new Date(y,m-1,1).getDay()+6)%7,dim=new Date(y,m,0).getDate();
 const RA=R.filter(r=>r.Estado==="Aprobada");
 let c="";for(let i=0;i<off;i++)c+="<div></div>";
 for(let d=1;d<=dim;d++){const ds=`${y}-${pad(m)}-${pad(d)}`,ws=W.filter(w=>w.Fecha===ds),ra=RA.some(r=>r.Fecha===ds),real=ws.filter(w=>!isRest(w));
  c+=`<div class="cd ${ds===today()?"now":""} ${ds===sel?"sel":""}" onclick="sel='${ds}';render()">${d}<div class="dots">${real.length?`<i class="${real.every(isDone)?"g":"r"}"></i>`:""}${ra?'<i class="b"></i>':""}</div></div>`}
 const sw=sel?W.filter(w=>w.Fecha===sel):[],sr=sel?RA.find(r=>r.Fecha===sel):null;
 return `<div class="mn"><button onclick="mv(-1)">‹</button><h2 style="margin:0">${MES[m-1]} ${y}</h2><button onclick="mv(1)">›</button></div><div class="card"><div class="cal">${DIAS.map(d=>`<div class="h">${d[0]}</div>`).join("")}${c}</div><div class="muted" style="margin-top:10px;font-size:13px">🟢 hecho · 🟡 pendiente · 🔵 carrera</div></div>`
 +(sel?`<h2>${fmtL(sel)}</h2>`+(sr?`<div class="card wk big"><div class="tag">🏁 Carrera</div><div class="num">${esc(sr.Nombre_Carrera)}</div><div class="row"><span>Distancia</span><b>${N(sr.Distancia_km)} km</b></div><div class="row"><span>Sitio</span><b>${esc(sr.Sitio)}</b></div></div>`:"")+(sw.length?sw.map(w=>wCard(w,0)).join(""):(sr?"":'<div class="card muted">Día de descanso.</div>')):'<div class="muted">Toca un día para ver el entrenamiento.</div>')}
function races(){
 const l=[...R].sort((a,b)=>a.Fecha<b.Fecha?-1:1).map(r=>{const c={Aprobada:"ok",Pendiente:"w",Rechazada:"no"}[r.Estado]||"w";
  return `<div class="card"><div class="mn" style="margin:0"><b>${esc(r.Nombre_Carrera)}</b><span class="bd ${c}">${r.Estado==="Pendiente"?"Esperando aprobación":esc(r.Estado)}</span></div><div class="muted">${fmtL(r.Fecha)} · ${N(r.Distancia_km)} km · ${esc(r.Sitio)}</div></div>`}).join("");
 return `<h2>Agregar carrera</h2><div class="card"><label>Nombre</label><input id="rn" placeholder="Ej: 21K Ávila"><label>Fecha</label><input id="rd" type="date"><label>Distancia (km)</label><input id="rk" type="number" step="any" inputmode="decimal"><label>Sitio</label><input id="rs" placeholder="Lugar de la carrera"><button class="btn pri" onclick="addRace()">Enviar al coach</button></div><h2>Mis carreras</h2>${l||'<div class="muted">Sin carreras todavía.</div>'}<div class="muted" style="font-size:13px">Las carreras aprobadas aparecen también en tu Calendario.</div>`}
async function addRace(){const n=$("#rn").value.trim(),d=$("#rd").value,k=$("#rk").value,s=$("#rs").value.trim();
 if(!n||!d||!k||!s)return toast("Completa nombre, fecha, distancia y sitio");
 const r={ID:uid("C"),ID_Aguila:me.ID,Nombre_Carrera:n,Fecha:d,Distancia_km:+k,Sitio:s,Estado:"Pendiente"};
 R.push({...r});render();
 try{await post({action:"add",sheet:"Carreras",data:r});toast("Enviada. El coach debe aprobarla.")}catch(e){toast("No se pudo guardar")}}
function tiempos(){
 const rows=DISTS.map(([k,l])=>{const r=TM.find(x=>x.Distancia===k);
  return `<div class="row"><span>${l}</span><b>${r&&r.Tiempo?rtime(r.Tiempo)+(r.Fecha?" · "+fmtL(nd(r.Fecha)):""):"—"}</b></div>`}).join("");
 const y=String(new Date().getFullYear()),pr=RP.filter(x=>String(x["Año"]||"").trim()===y).length;
 return `<h2>Tus tiempos</h2><div class="card">${rows}</div><span class="muted" style="font-size:13px">El coach carga y actualiza tus mejores tiempos.</span>
 <h2 style="margin-top:18px">Récords personales ${y}</h2><div class="card" style="text-align:center"><div class="num">${pr}</div><span class="muted">récords personales este año</span></div>`}
init();
</script></body></html>
